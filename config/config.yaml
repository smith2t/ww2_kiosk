display:
  fullscreen: false  # Set to false for testing
  width: 1920
  height: 1080
  slideshow_interval: 10  # seconds between images
  transition_duration: 1.0  # fade transition time
  shuffle_slideshow: true
  idle_timeout: 30  # seconds before returning to slideshow
  video_player: vlc  # omxplayer (hardware accel) or vlc
  # LED pins - ACTIVE wiring (move LED1 from Pin10 to Pin18!)
  led1_pin: 228   # GPIO 228 (Physical Pin 18) - LED 1 *** MOVE WIRE FROM PIN 10 TO PIN 18 ***
  led2_pin: 267   # GPIO 267 (Physical Pin 32) - LED 2
  led3_pin: 76    # GPIO 76  (Physical Pin 36) - LED 3
  led4_pin: 260   # GPIO 260 (Physical Pin 38) - LED 4

input:
  # Button pins - ACTIVE wiring (move Button4 from Pin8 to Pin11!)
  button1_pin: 264  # GPIO 264 (Physical Pin 3)  - Button 1
  button2_pin: 263  # GPIO 263 (Physical Pin 5)  - Button 2
  button3_pin: 269  # GPIO 269 (Physical Pin 7)  - Button 3
  button4_pin: 226  # GPIO 226 (Physical Pin 11) - Button 4 *** MOVE WIRE FROM PIN 8 TO PIN 11 ***
  debounce_time: 50  # milliseconds

media:
  base_dir: /home/orangepi/ww2_kiosk-main/media
  videos_dir: /home/orangepi/ww2_kiosk-main/media/videos
  pictures_dir: /home/orangepi/ww2_kiosk-main/media/pictures

network:
  enable_ap: true
  ap_ssid: WW2-Kiosk-AP
  ap_password: ww2kiosk2024
  ap_interface: wlan0
  enable_smb: true
  smb_username: kiosk
  smb_password: kiosk123